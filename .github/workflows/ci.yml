name: Validate BrickMedic
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:up
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - if: always()
        run: docker compose down
